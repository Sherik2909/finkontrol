<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Личные финансы: долги, кредиты, зарплата, ежедневные траты и отчёты">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ФинКонтроль">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>ФинКонтроль</title>
  <style>
:root {
  --bg: #0b1020;
  --card: #141a2e;
  --card2: #1b2340;
  --line: #262f4f;
  --text: #e9edf7;
  --muted: #8a93ad;
  --accent: #4f8cff;
  --accent2: #7c5cff;
  --pos: #22c55e;
  --neg: #f87171;
  --warn: #f59e0b;
  --radius: 18px;
  --tab-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f2f4f9;
  --card: #ffffff;
  --card2: #eef1f8;
  --line: #e1e5ef;
  --text: #121829;
  --muted: #6b7490;
  --pos: #16a34a;
  --neg: #dc2626;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app { max-width: 680px; margin: 0 auto; padding-bottom: calc(var(--tab-h) + var(--safe-b) + 96px); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: calc(var(--safe-t) + 10px) 16px 10px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.topbar h1 { font-size: 21px; margin: 0; flex: 1; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  border: 0; background: var(--card2); width: 38px; height: 38px; border-radius: 12px;
  font-size: 22px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none;
}
#view { padding: 4px 14px 0; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: space-around;
  height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: var(--card); border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 140px; border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; cursor: pointer;
}
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabbar svg circle { fill: currentColor; stroke: none; }
.tabbar button.active { color: var(--accent); }

.fab {
  position: fixed; z-index: 31; right: max(18px, calc(50% - 322px));
  bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
  width: 60px; height: 60px; border-radius: 20px; border: 0; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  font-size: 34px; font-weight: 300; line-height: 1;
  box-shadow: 0 10px 30px rgba(79, 140, 255, .45);
}
.fab:active { transform: scale(.94); }

/* ---------- cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.card-title { font-weight: 650; font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title .link { font-weight: 500; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }
.hero {
  background: linear-gradient(135deg, #2b4fd8 0%, #6a3fe0 100%); border: 0; color: #fff;
}
.hero .muted { color: rgba(255,255,255,.75); }
.big { font-size: 34px; font-weight: 750; letter-spacing: -.8px; margin: 2px 0 10px; }
.big2 { font-size: 28px; font-weight: 750; letter-spacing: -.5px; }
.hero .big.neg { color: #ffd0d0; }
.acc-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.acc-chips::-webkit-scrollbar { display: none; }
.acc-chip {
  flex: none; background: rgba(255,255,255,.15); border-radius: 12px; padding: 7px 11px; cursor: pointer;
  display: flex; flex-direction: column; font-size: 12px; min-width: 100px;
}
.acc-chip b { font-size: 14px; }

.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.warn { color: var(--warn); }
.center { text-align: center; }
.mt { margin-top: 10px; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 5px 0; }
.kv span { color: var(--muted); }
.kv b { white-space: nowrap; }
.kv.total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }
.kv.total span { color: var(--text); font-weight: 600; }
.row-between { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.progress { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin: 10px 0 8px; }
.progress i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s; }
.progress.thin { height: 5px; margin: 6px 0 0; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--card2); border-radius: 14px; padding: 10px 12px; }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 17px; }

/* ---------- rows / lists ---------- */
.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 2px;
  border-bottom: 1px solid var(--line); cursor: default;
}
.row:last-child { border-bottom: 0; }
.row[data-act] { cursor: pointer; }
.row .ico {
  width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--card2);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-weight: 650; white-space: nowrap; text-align: right; }
.row.done { opacity: .55; }
.row.overdue .s { color: var(--neg); }
.day-head {
  display: flex; justify-content: space-between; font-size: 13px; color: var(--muted);
  padding: 14px 4px 4px; font-weight: 600;
}
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
.empty .e { font-size: 40px; display: block; margin-bottom: 6px; }

.badge { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: var(--card2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: rgba(34,197,94,.15); color: var(--pos); }
.badge.bad { background: rgba(248,113,113,.15); color: var(--neg); }
.badge.wn { background: rgba(245,158,11,.15); color: var(--warn); }

.alert {
  border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px;
  background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35);
}
.alert.info { background: rgba(79,140,255,.1); border-color: rgba(79,140,255,.35); }
.alert.ok { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.35); }
.alert.wn { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.4); }

/* ---------- buttons ---------- */
.btn {
  border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; font-weight: 600;
  background: var(--card2); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.btn.danger { background: rgba(248,113,113,.15); color: var(--neg); }
.btn.ghost { background: transparent; border: 1px dashed var(--line); color: var(--accent); }
.btn.block { width: 100%; }
.btn:active { transform: scale(.97); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btns .btn { flex: 1; min-width: 120px; }
.grow { flex: 1; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px;
  padding: 7px 13px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.month-switch { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-switch b { font-size: 17px; }
.search {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 11px 14px; margin-bottom: 10px; outline: none;
}

/* ---------- menu tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; cursor: pointer; text-align: left;
}
.tile .e { font-size: 26px; }
.tile b { display: block; margin-top: 6px; }
.tile span { color: var(--muted); font-size: 12.5px; }

/* ---------- debt card ---------- */
.debt .head { display: flex; gap: 12px; align-items: center; }
.debt .head .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
.debt .rem { font-size: 22px; font-weight: 750; }
.debt .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.debt .meta div { background: var(--card2); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.debt .meta b { display: block; color: var(--text); font-size: 13.5px; }
.debt .close-txt { font-size: 13px; margin-top: 10px; }

.strategy { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.strategy > div { background: var(--card2); border-radius: 14px; padding: 12px; }
.strategy h4 { margin: 0 0 6px; font-size: 14px; }
.strategy ol { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }

/* ---------- reports ---------- */
.donut-wrap { display: flex; justify-content: center; margin: 4px 0 8px; }
.donut { width: 210px; height: 210px; }
.donut .d1 { font-size: 16px; font-weight: 750; fill: var(--text); }
.donut .d2 { font-size: 10px; fill: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 140px; padding-top: 6px; }
.bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.bar i { display: block; width: 100%; max-width: 22px; background: linear-gradient(180deg, var(--accent), var(--accent2)); border-radius: 4px 4px 1px 1px; min-height: 1px; }
.bar span { font-size: 9.5px; color: var(--muted); height: 14px; margin-top: 3px; white-space: nowrap; }
.insight { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.insight:last-child { border-bottom: 0; }
.insight .e { font-size: 20px; flex: none; }

/* ---------- forms / sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 100; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .2s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px;
  max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 16px calc(18px + var(--safe-b));
  transform: translateY(100%); transition: transform .22s ease-out;
}
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-handle { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 2px auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-head h3 { margin: 0; font-size: 18px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 14px; position: sticky; bottom: 0; background: var(--card); padding-top: 8px; }

.form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); }
.field small { color: var(--muted); font-size: 11.5px; }
.field input, .field select, .field textarea, .inp {
  width: 100%; border: 1px solid var(--line); background: var(--card2); border-radius: 12px;
  padding: 11px 12px; outline: none; min-height: 44px;
}
.field input:focus, .field select:focus, .inp:focus, .amount-input:focus { border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.amount-input {
  width: 100%; border: 1px solid var(--line); background: var(--card2); border-radius: 14px;
  padding: 12px; font-size: 32px; font-weight: 750; text-align: center; outline: none;
}
.preview { background: var(--card2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.preview:empty { display: none; }

.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; }
.seg label { flex: 1; }
.seg input { display: none; }
.seg span { display: block; text-align: center; padding: 9px 6px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg input:checked + span { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.2); }

.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 236px; overflow-y: auto; }
.cat-grid:empty { display: none; }
.cat-chip input { display: none; }
.cat-chip span {
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
  padding: 7px 3px; border-radius: 12px; border: 1.5px solid transparent; background: var(--card2);
  font-size: 11px; line-height: 1.15; cursor: pointer; height: 100%; word-break: break-word;
}
.cat-chip b { font-size: 21px; font-weight: 400; }
.cat-chip input:checked + span { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--card2)); }

.palette { display: flex; flex-wrap: wrap; gap: 8px; }
.palette label input { display: none; }
.palette .sw { width: 30px; height: 30px; border-radius: 50%; display: block; border: 3px solid transparent; cursor: pointer; }
.palette input:checked + .sw { border-color: var(--text); }
.emoji-pick { display: flex; flex-wrap: wrap; gap: 4px; }
.emoji-pick button { border: 0; background: var(--card2); border-radius: 8px; width: 36px; height: 36px; font-size: 19px; cursor: pointer; }

.budget-inp { width: 110px; text-align: right; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 90px); z-index: 200;
  transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
  transition: .2s; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- lock ---------- */
.lock { position: fixed; inset: 0; z-index: 500; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.lock-box { text-align: center; }
.lock-logo { font-size: 46px; }
.dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0 26px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px; }
.keypad button { height: 74px; border-radius: 50%; border: 0; background: var(--card2); font-size: 26px; cursor: pointer; }
.lock-forgot { margin-top: 22px; background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; }

/* ---------- print ---------- */
#printArea { display: none; }
@media print {
  body { background: #fff; color: #000; }
  #app, .sheet-wrap, .toast, .lock { display: none !important; }
  #printArea { display: block; font: 12px/1.4 Arial, sans-serif; color: #000; }
  #printArea h1 { font-size: 20px; margin: 0 0 4px; }
  #printArea h2 { font-size: 15px; margin: 18px 0 6px; }
  #printArea table { width: 100%; border-collapse: collapse; }
  #printArea th, #printArea td { border-bottom: 1px solid #ccc; padding: 4px 6px; text-align: left; }
  #printArea td.r, #printArea th.r { text-align: right; }
}

@media (max-width: 380px) {
  .cat-grid { grid-template-columns: repeat(3, 1fr); }
  .big { font-size: 30px; }
  .debt .meta { grid-template-columns: repeat(2, 1fr); }
  .strategy { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" data-act="back" aria-label="Назад">‹</button>
      <h1 id="title">ФинКонтроль</h1>
      <div id="topActions"></div>
    </header>

    <main id="view"></main>

    <button class="fab" data-act="quickAdd" aria-label="Добавить операцию">+</button>

    <nav class="tabbar">
      <button data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Главная</span>
      </button>
      <button data-tab="ops">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Операции</span>
      </button>
      <button data-tab="debts">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>
        <span>Долги</span>
      </button>
      <button data-tab="reports">
        <svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-6M2 20h20"/></svg>
        <span>Отчёты</span>
      </button>
      <button data-tab="more">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Ещё</span>
      </button>
    </nav>
  </div>

  <div id="sheetWrap" class="sheet-wrap hidden">
    <div class="sheet-backdrop" data-act="closeSheet"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="toast" class="toast"></div>
  <div id="lock" class="lock hidden"></div>
  <div id="printArea"></div>

<script>
'use strict';
/* =========================================================
   ФинКонтроль — ядро: данные, хранение, расчёты.
   Все данные хранятся локально на устройстве (localStorage).
   ========================================================= */

const KEY = 'finkontrol_v1';
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DAY_FORMS = ['день','дня','дней'];
const MONTH_FORMS = ['месяц','месяца','месяцев'];
const CURRENCIES = [['₽','Рубль ₽'],['₸','Тенге ₸'],['сум','Сум (UZS)'],['сом','Сом (KGS)'],['с.','Сомони (TJS)'],['₴','Гривна ₴'],['Br','Бел. рубль'],['$','Доллар $'],['€','Евро €']];
const DEBT_KINDS = {
  credit:      { n: 'Потребкредит',     i: '🏦' },
  mortgage:    { n: 'Ипотека',          i: '🏠' },

function balances() {

  for (const t of S.transactions) {
    if (t.type === 'income') { if (t.accountId in b) b[t.accountId] += t.amount; }

    else if (t.type === 'transfer') {
      if (t.accountId in b) b[t.accountId] -= t.amount;

}

function debtPaidPrincipal(id) {

}

/** Симуляция погашения одного долга аннуитетом */
function payoff(bal, ratePct, pay) {

  if (!(pay > 0)) return null;
  let m = 0, int = 0;
  while (bal > 0.005 && m < 600) {
    const i = bal * r;
    if (r > 0 && pay <= i) return { never: true };
    int += i; bal = bal + i - pay; m++;

  const p = payoff(rem, d.rate, +d.payment || 0);
  if (!p || p.never) return p;
  const now = new Date();
  const start = isPlanDone('debt:' + d.id, ym(now)) ? 1 : 0;

/** Стратегии погашения: avalanche (сначала высокая ставка) / snowball (сначала маленький остаток) */
function simulateAll(extra, strategy) {
  const list = activeOweDebts().map(d => ({ id: d.id, name: d.name, bal: debtRemaining(d), r: (+d.rate || 0) / 1200, pay: +d.payment || 0, rate: +d.rate || 0, closedAt: 0 }));
  if (!list.length) return { months: 0, interest: 0, order: [] };
  let month = 0, interest = 0; const order = [];
  while (list.some(x => x.bal > 0.005) && month < 600) {
    month++;
    let pool = extra;
    for (const x of list) {
      if (x.bal <= 0.005) { pool += x.pay; continue; } // освободившиеся платежи идут в «снежный ком»
      const i = x.bal * x.r; x.bal += i; interest += i;
      const p = Math.min(x.pay, x.bal); x.bal -= p; pool += x.pay - p;
    }
    const active = list.filter(x => x.bal > 0.005);
    active.sort(strategy === 'avalanche' ? (a, b) => b.rate - a.rate || a.bal - b.bal : (a, b) => a.bal - b.bal || b.rate - a.rate);
    for (const x of active) {
      if (pool <= 0) break;
      const p = Math.min(pool, x.bal); x.bal -= p; pool -= p;

    for (const x of list) if (x.bal <= 0.005 && !x.closedAt) { x.closedAt = month; order.push(x); }

function planItems(monthDate) {

  S.bills.filter(x => x.active !== false).forEach(x => out.push({ kind: 'bill', key: 'bill:' + x.id, ref: x, name: x.name, icon: cat(x.categoryId)?.icon || '🧾', amount: +x.amount || 0, date: mk(x.day) }));
  S.debts.filter(d => !d.closed && d.kind !== 'lent' && +d.payment > 0).forEach(d => {
    const rem = debtRemaining(d), done = isPlanDone('debt:' + d.id, ymS);
    if (rem <= 0 && !done) return;
    const due = rem > 0 ? Math.min(+d.payment, r2(rem * (1 + (+d.rate || 0) / 1200))) : +d.payment;
    out.push({ kind: 'debt', key: 'debt:' + d.id, ref: d, name: d.name, icon: (DEBT_KINDS[d.kind] || DEBT_KINDS.credit).i, amount: due, date: mk(d.payDay) });

/** Главный прогноз: сколько свободно, сколько можно тратить в день */

  const incMonth = r2(sum(curUnpaid.filter(i => i.kind === 'income'), 'amount'));
  const all = curUnpaid.concat(nxt.filter(i => !i.done));
  const nextInc = all.find(i => i.kind === 'income' && i.date >= today) || null;
  const horizon = nextInc ? nextInc.date : toISO(addMonths(now, 1));
  const before = all.filter(i => i.kind !== 'income' && i.date < horizon);
  const oblBefore = r2(sum(before, 'amount'));
  const days = Math.max(1, diffDays(today, horizon));
  const free = r2(total - oblBefore);
  const daily = r2(free / days);
  const isDaily = t => t.type === 'expense' && !t.plan && !t.debtId;
  const spentToday = r2(sum(S.transactions.filter(t => isDaily(t) && t.date === today), 'amount'));

  const avgDaily = r2(sum(S.transactions.filter(t => isDaily(t) && t.date > from30 && t.date <= today), 'amount') / 30);

}

  if (t.debtId) { const d = debtById(t.debtId); if (d) name = (t.type === 'income' ? 'Возврат: ' : 'Платёж: ') + d.name; }
  if (t.note) sub = esc(t.note) + ' · ' + sub;
  const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '';
  return `<div class="row" data-act="editTx" data-id="${t.id}">
    <div class="ico" style="background:${c ? c.color + '22' : 'var(--card2)'}">${icon}</div>
    <div class="grow"><div class="t">${esc(name)}</div><div class="s">${sub}</div></div>
    <div class="amt ${t.type === 'income' ? 'pos' : ''}">${sign}${money(t.amount)}</div>
  </div>`;
}

function debtCard(d) {
  const rem = debtRemaining(d);
  const total = +d.total || rem;
  const paidPct = total > 0 ? clamp((total - rem) / total * 100, 0, 100) : 0;
  const k = DEBT_KINDS[d.kind] || DEBT_KINDS.credit;
  const lent = d.kind === 'lent';
  const po = +d.payment > 0 ? debtPayoffInfo(d) : null;
  const monthDone = isPlanDone('debt:' + d.id, ym(new Date()));
  let closeTxt;
  if (rem <= 0) closeTxt = '<span class="pos">Полностью закрыт 🎉</span>';
  else if (!po) closeTxt = '<span class="muted">Без графика — укажите платёж в месяц, чтобы увидеть дату закрытия</span>';
  else if (po.never) closeTxt = '<span class="neg">⚠️ Платёж меньше начисляемых процентов — долг не уменьшается! Нужно платить больше.</span>';
  else closeTxt = `${lent ? 'Вернут' : 'Закроется'} через <b>${po.months} ${plural(po.months, MONTH_FORMS)}</b> — <b>${fmtMonthYear(po.date)}</b>${po.interest > 0 ? `<br><span class="muted">Ещё переплата процентами: ${money(po.interest)}</span>` : ''}`;
  return `<section class="card debt">
    <div class="head"><div class="ico">${k.i}</div>
      <div class="grow" style="min-width:0"><div style="font-weight:650">${esc(d.name)}</div><div class="muted small">${k.n}${d.note ? ' · ' + esc(d.note) : ''}</div></div>
      ${!lent && +d.payment > 0 && rem > 0 ? (monthDone ? '<span class="badge ok">оплачен в этом мес.</span>' : '<span class="badge wn">не оплачен</span>') : ''}
    </div>
    <div class="row-between" style="margin-top:12px;align-items:baseline"><div><div class="muted small">${lent ? 'Вам должны' : 'Осталось выплатить'}</div><div class="rem ${lent ? 'pos' : ''}">${money(rem)}</div></div>
      <div class="muted small" style="text-align:right">из ${money(total)}<br>${lent ? 'возвращено' : 'выплачено'} ${Math.round(paidPct)}%</div></div>
    ${progressBar(paidPct, 'var(--pos)')}
    <div class="meta">
      <div>Платёж/мес<b>${+d.payment ? money(d.payment) : '—'}</b></div>
      <div>День<b>${d.payDay ? d.payDay + '-е число' : '—'}</b></div>
      <div>Ставка<b>${+d.rate ? d.rate + '%' : '0%'}</b></div>
    </div>
    <div class="close-txt">${closeTxt}</div>
    <div class="btns">
      ${rem > 0 ? `<button class="btn sm primary" data-act="payDebt" data-id="${d.id}">${lent ? '💰 Мне вернули' : '💳 Внести платёж'}</button>` : ''}
      <button class="btn sm" data-act="debtHistory" data-id="${d.id}">История</button>
      <button class="btn sm" data-act="editDebt" data-id="${d.id}">Изменить</button>
    </div>
  </section>`;
}

function viewDebts() {
  const owe = S.debts.filter(d => !d.closed && d.kind !== 'lent');
  const lent = S.debts.filter(d => !d.closed && d.kind === 'lent');
  const closed = S.debts.filter(d => d.closed);
  if (!S.debts.length) {
    return `<section class="card">${emptyBox('🏦', 'Здесь будут все ваши кредиты, ипотека, рассрочки, кредитки, микрозаймы, долги людям — и кто должен вам.<br><br>Приложение посчитает, когда закроется каждый долг, сколько переплата, и подскажет, как закрыть быстрее.')}
      <button class="btn primary block" data-act="addDebt">+ Добавить долг или кредит</button></section>`;
  }
  const act = owe.filter(d => debtRemaining(d) > 0);
  const totalOwe = sum(act.map(debtRemaining));
  const monthly = sum(act, 'payment');
  const income = sum(S.incomes.filter(i => i.active !== false), 'amount');
  const pdn = income > 0 ? monthly / income * 100 : null;
  const infos = act.map(d => +d.payment > 0 ? debtPayoffInfo(d) : null);
  const anyNever = infos.some(p => p && p.never);
  const noSched = infos.some(p => !p);
  const freedom = infos.filter(p => p && p.date).reduce((m, p) => !m || p.date > m ? p.date : m, null);
  const interestAhead = sum(infos.filter(p => p && !p.never), 'interest');
  let h = '';
  if (act.length) {
    let pdnTxt = '', pdnCls = '';
    if (pdn != null) {
      if (pdn < 30) { pdnCls = 'pos'; pdnTxt = 'Нормальная нагрузка'; }
      else if (pdn < 50) { pdnCls = 'warn'; pdnTxt = 'Высокая — новые кредиты не берите'; }
      else { pdnCls = 'neg'; pdnTxt = 'Критическая! Больше половины дохода уходит на долги'; }
    }
    h += `<section class="card">
      <div class="card-title">📌 Сводка по долгам</div>
      <div class="stats">
        <div class="stat"><span>Всего должен</span><b class="neg">${money(totalOwe)}</b></div>
        <div class="stat"><span>Платежи в месяц</span><b>${money(monthly)}</b></div>
        <div class="stat"><span>Свобода от долгов</span><b>${anyNever ? '∞' : freedom ? cap(fmtMonthYear(freedom)) : '—'}</b></div>
        <div class="stat"><span>Переплата впереди</span><b>${money(interestAhead)}</b></div>
      </div>
      ${pdn != null ? `<div class="mt"><div class="row-between small"><span>Долговая нагрузка (ПДН): <b class="${pdnCls}">${Math.round(pdn)}%</b> дохода</span><span class="${pdnCls}">${pdnTxt}</span></div>${progressBar(pdn, pdnCls === 'pos' ? 'var(--pos)' : pdnCls === 'warn' ? 'var(--warn)' : 'var(--neg)')}</div>` : '<div class="muted small mt">Добавьте доходы в «Ещё → Доходы и платежи», чтобы увидеть долговую нагрузку.</div>'}
      ${noSched ? '<div class="muted small">У некоторых долгов не указан платёж в месяц — они не учтены в дате свободы.</div>' : ''}
    </section>`;
  }
  h += owe.map(debtCard).join('');
  if (act.length >= 1) h += strategyCard();
  if (lent.length) {
    h += `<div class="day-head" style="font-size:15px;color:var(--text)"><span>💸 Мне должны: ${money(sum(lent.map(debtRemaining)))}</span></div>` + lent.map(debtCard).join('');
  }
  if (closed.length) {
    h += `<button class="btn block ghost" data-act="toggleClosed">${nav.showClosed ? 'Скрыть' : 'Показать'} закрытые (${closed.length})</button><div style="height:10px"></div>`;
    if (nav.showClosed) h += closed.map(debtCard).join('');
  }
  return h;
}

function strategyCard() {
  const act = activeOweDebts().filter(d => +d.payment > 0);
  if (!act.length) return '';
  const base = simulateAll(0, 'avalanche');
  const extra = nav.extra || 0;
  const av = simulateAll(extra, 'avalanche'), sn = simulateAll(extra, 'snowball');
  const now = new Date();
  const res = (r, title, desc) => {
    if (r.never) return `<div><h4>${title}</h4><div class="neg small">Не погасится — увеличьте платежи</div></div>`;
    const saved = base.never ? 0 : r2(base.interest - r.interest);
    return `<div><h4>${title}</h4><div class="muted small">${desc}</div>
      <div class="mt"><b>${r.months} ${plural(r.months, MONTH_FORMS)}</b> → ${fmtMonthYear(addMonths(now, r.months - 1))}</div>
      <div class="small">Переплата: ${money(r.interest)}</div>
      ${saved > 0 ? `<div class="small pos">Экономия: ${money(saved)}</div>` : ''}
      <ol>${r.order.map(x => `<li>${esc(x.name)} — ${x.closedAt} мес.</li>`).join('')}</ol></div>`;
  };
  return `<section class="card">
    <div class="card-title">🧠 Как закрыть долги быстрее</div>
    <div class="muted small">Сколько вы можете добавлять сверху к платежам каждый месяц? Когда один долг закрывается, его платёж идёт на следующий («снежный ком»).</div>
    <div class="field mt"><span>Доплата в месяц</span><input class="inp" id="extraInp" inputmode="decimal" value="${extra || ''}" placeholder="например 5000"></div>
    <div class="mt"></div>
    <div class="strategy">
      ${res(av, '🏔 Лавина', 'Сначала самая высокая ставка — максимальная экономия')}
      ${res(sn, '⛄ Снежный ком', 'Сначала самый маленький долг — быстрые победы, мотивация')}
    </div>
    ${!base.never ? `<div class="muted small mt">Без доплат и без «снежного кома» последний долг закроется через ${Math.max(0, ...activeOweDebts().map(d => (debtPayoffInfo(d) || {}).months || 0))} мес.</div>` : ''}
  </section>`;
}

/* =================== ОТЧЁТЫ =================== */
function donutSVG(parts, top, bottom) {
  const total = sum(parts, 'value'); const R = 70, C = 2 * Math.PI * R; let off = 0;
  const segs = total > 0 ? parts.map(p => {
    const len = p.value / total * C;
    const s = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${p.color}" stroke-width="24" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`;
    off += len; return s;
  }).join('') : `<circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--line)" stroke-width="24"/>`;
  return `<svg viewBox="0 0 180 180" class="donut"><g transform="rotate(-90 90 90)">${segs}</g>
    <text x="90" y="88" text-anchor="middle" class="d1">${esc(top)}</text><text x="90" y="106" text-anchor="middle" class="d2">${esc(bottom)}</text></svg>`;
}
function barsHTML(list, from, to) {
  const days = diffDays(from, to) + 1; const d0 = parseISO(from); let buckets = [];
  if (days <= 62) {
    const map = {}; list.forEach(t => map[t.date] = (map[t.date] || 0) + t.amount);
    for (let i = 0; i < days; i++) { const d = addDays(d0, i); const k = toISO(d); buckets.push({ k: fmtDate(k), label: d.getDate(), v: map[k] || 0 }); }
  } else {
    const map = {}; list.forEach(t => { const k = t.date.slice(0, 7); map[k] = (map[k] || 0) + t.amount; });
    let d = addMonths(d0, 0); const end = parseISO(to);
    while (d <= end) { const k = ym(d); buckets.push({ k: fmtMonthYear(d), label: MONTHS_SHORT[d.getMonth()], v: map[k] || 0 }); d = addMonths(d, 1); }
  }
  const max = Math.max(0, ...buckets.map(b => b.v));
  const step = Math.ceil(buckets.length / 10);
  return `<div class="bars">${buckets.map((b, i) => `<div class="bar" title="${esc(b.k)}: ${esc(money(b.v))}"><i style="height:${max ? b.v / max * 100 : 0}%"></i><span>${i % step === 0 ? b.label : ''}</span></div>`).join('')}</div>`;
}

function reportData() {
  const { from, to, label } = periodRange(nav.rp, nav.rFrom, nav.rTo);
  const list = S.transactions.filter(t => t.date >= from && t.date <= to);
  const exps = list.filter(t => t.type === 'expense'), incs = list.filter(t => t.type === 'income');
  const exp = r2(sum(exps, 'amount')), inc = r2(sum(incs, 'amount'));
  const pr = prevRange(from, to);
  const prevExps = S.transactions.filter(t => t.type === 'expense' && t.date >= pr.from && t.date <= pr.to);
  return { from, to, label, list, exps, incs, exp, inc, pr, prevExps, cats: byCategory(exps), prevCats: byCategory(prevExps), incCats: byCategory(incs) };
}

function viewReports() {
  const R = reportData();
  const today = todayStr();
  const elapsed = Math.max(1, diffDays(R.from, R.to < today ? R.to : today) + 1);
  const avg = R.exp / elapsed;
  const prevExp = sum(R.prevExps, 'amount');
  const small = R.exps.filter(t => !t.debtId && !t.plan && t.amount <= (+S.settings.smallLimit || 0));
  const smallSum = sum(small, 'amount');
  const debtPaid = sum(R.exps.filter(t => t.debtId), 'amount');
  const savingsRate = R.inc > 0 ? (R.inc - R.exp) / R.inc * 100 : null;
  const prevMap = {}; R.prevCats.forEach(x => prevMap[x.id] = x.v);

  let h = `<div class="chips">${[['month', 'Этот месяц'], ['prev', 'Прошлый'], ['3m', '3 месяца'], ['year', 'Год'], ['all', 'Всё время'], ['custom', 'Период…']].map(([k, l]) => `<button class="chip ${nav.rp === k ? 'active' : ''}" data-act="rp" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (nav.rp === 'custom') {
    h += `<div class="grid2" style="margin-bottom:10px"><label class="field"><span>С</span><input type="date" data-rdate="rFrom" value="${R.from}"></label><label class="field"><span>По</span><input type="date" data-rdate="rTo" value="${R.to}"></label></div>`;
  }
  h += `<section class="card"><div class="card-title">${esc(R.label)}</div>
    <div class="stats">
      <div class="stat"><span>Доходы</span><b class="pos">${money(R.inc)}</b></div>
      <div class="stat"><span>Расходы</span><b>${money(R.exp)}</b></div>
      <div class="stat"><span>Остаток (доходы − расходы)</span><b class="${R.inc - R.exp < 0 ? 'neg' : 'pos'}">${money(R.inc - R.exp)}</b></div>
      <div class="stat"><span>В среднем в день</span><b>${money(avg)}</b></div>
    </div></section>`;

  // инсайты
  const ins = [];
  if (savingsRate != null) ins.push(['🐷', savingsRate >= 20 ? `Вы сохранили <b>${Math.round(savingsRate)}%</b> дохода — отлично! Цель: 10–20% и больше.` : savingsRate >= 0 ? `Сохранено <b>${Math.round(savingsRate)}%</b> дохода. Старайтесь откладывать хотя бы 10%.` : `Расходы превысили доходы на <b>${money(R.exp - R.inc)}</b>. Срочно найдите, что сократить.`]);
  if (smallSum > 0) ins.push(['🪙', `Мелкие траты (до ${money(S.settings.smallLimit)}): <b>${small.length} шт. на ${money(smallSum)}</b> — ${Math.round(smallSum / (R.exp || 1) * 100)}% расходов. В пересчёте на год это ≈ <b>${money(smallSum / elapsed * 365)}</b>.`]);
  if (R.cats[0]) ins.push([R.cats[0].c.icon, `Больше всего ушло на «${esc(R.cats[0].c.name)}»: <b>${money(R.cats[0].v)}</b> (${Math.round(R.cats[0].v / R.exp * 100)}%).`]);
  if (debtPaid > 0) ins.push(['🏦', `На кредиты и долги: <b>${money(debtPaid)}</b>${R.inc > 0 ? ` — ${Math.round(debtPaid / R.inc * 100)}% дохода` : ''}.`]);
  if (prevExp > 0 && R.exp > 0) { const ch = (R.exp - prevExp) / prevExp * 100; ins.push([ch > 0 ? '📈' : '📉', `По сравнению с предыдущим периодом расходы ${ch > 0 ? 'выросли' : 'снизились'} на <b>${Math.abs(Math.round(ch))}%</b> (${money(prevExp)} → ${money(R.exp)}).`]); }
  if (nav.rp === 'month' && R.exp > 0) ins.push(['🔮', `Если тратить в том же темпе, за месяц выйдет ≈ <b>${money(avg * dim(new Date()))}</b>.`]);
  if (ins.length) h += `<section class="card"><div class="card-title">🧭 Анализ</div>${ins.map(([e, t]) => `<div class="insight"><span class="e">${e}</span><div>${t}</div></div>`).join('')}</section>`;

  // категории
  h += `<section class="card"><div class="card-title">🍩 Расходы по категориям</div>`;
  if (R.cats.length) {
    h += `<div class="donut-wrap">${donutSVG(R.cats.map(x => ({ value: x.v, color: x.c.color })), moneyShort(R.exp), 'всего, ' + S.settings.currency)}</div><div class="list">`;
    h += R.cats.map(x => {
      const p = x.v / R.exp * 100; const pv = prevMap[x.id] || 0; const ch = pv ? (x.v - pv) / pv * 100 : null;
      const bud = +S.budgets[x.id] || 0;
      return `<div class="row" data-act="catDrill" data-id="${x.id}">
        <div class="ico" style="background:${x.c.color}22">${x.c.icon}</div>
        <div class="grow"><div class="t">${esc(x.c.name)}</div>
          <div class="s">${p.toFixed(1)}%${ch != null && Math.abs(ch) >= 1 ? ` · <span class="${ch > 0 ? 'neg' : 'pos'}">${ch > 0 ? '▲' : '▼'}${Math.abs(Math.round(ch))}%</span>` : ''}${bud && nav.rp === 'month' ? ` · бюджет ${money(bud)}` : ''}</div>
          <div class="progress thin"><i style="width:${p}%;background:${x.c.color}"></i></div></div>
        <div class="amt">${money(x.v)}</div></div>`;
    }).join('') + '</div>';
  } else h += emptyBox('📭', 'Нет расходов за этот период');
  h += `</section>`;

  if (R.exps.length) h += `<section class="card"><div class="card-title">📆 Расходы по ${diffDays(R.from, R.to) <= 62 ? 'дням' : 'месяцам'}</div>${barsHTML(R.exps, R.from, R.to)}</section>`;

  if (R.incCats.length) {
    h += `<section class="card"><div class="card-title">💼 Доходы по источникам</div><div class="list">${R.incCats.map(x => `<div class="row"><div class="ico">${x.c.icon}</div><div class="grow"><div class="t">${esc(x.c.name)}</div></div><div class="amt pos">+${money(x.v)}</div></div>`).join('')}</div></section>`;
  }

  const top = R.exps.slice().sort((a, b) => b.amount - a.amount).slice(0, 10);
  if (top.length) h += `<section class="card"><div class="card-title">🔝 Самые крупные траты</div><div class="list">${top.map(txRow).join('')}</div></section>`;

  h += `<section class="card"><div class="card-title">📤 Выгрузить отчёт</div>
    <div class="muted small">CSV открывается в Excel и Google Таблицах. PDF — через «Печать → Сохранить как PDF».</div>
    <div class="btns">
      <button class="btn" data-act="exportCSV">📄 Операции (Excel)</button>
      <button class="btn" data-act="exportCatCSV">📊 По категориям (Excel)</button>
      <button class="btn" data-act="printReport">🖨 PDF / печать</button>
    </div></section>`;
  return h;
}

'use strict';
/* =========================================================
   ФинКонтроль — модальные окна (sheets), обработчики событий,
   экспорт, PIN-блокировка, онбординг и PWA
   ========================================================= */

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- Bottom Sheet Engine ---------- */
function openSheet(title, bodyHTML, onMount) {
  const wrap = $('#sheetWrap'), sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-handle"></div>
    <div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-act="closeSheet" aria-label="Закрыть">✕</button></div>
    <div class="sheet-body">${bodyHTML}</div>`;
  wrap.classList.remove('hidden');
  requestAnimationFrame(() => wrap.classList.add('open'));
  if (onMount) onMount(sh);
}

function closeSheet() {
  const wrap = $('#sheetWrap');
  wrap.classList.remove('open');
  setTimeout(() => { wrap.classList.add('hidden'); $('#sheet').innerHTML = ''; }, 200);
}

function emojiPickerHTML(targetSelector) {
  return `<div class="emoji-pick">${EMOJIS.map(e => `<button type="button" data-pick-emoji="${e}" data-target="${targetSelector}">${e}</button>`).join('')}</div>`;
}

function paletteHTML(name, current) {
  return `<div class="palette">${COLORS.map(c => `<label><input type="radio" name="${name}" value="${c}" ${c === current ? 'checked' : ''}><span class="sw" style="background:${c}"></span></label>`).join('')}</div>`;
}

/* =================== 1. ОПЕРАЦИИ (ТРАТЫ / ДОХОДЫ / ПЕРЕВОДЫ) =================== */
function openTxSheet(txId = null, presetType = 'expense') {
  const existing = txId ? S.transactions.find(t => t.id === txId) : null;
  const t = existing ? Object.assign({}, existing) : {
    type: presetType,
    amount: '',
    categoryId: presetType === 'income' ? 'c_salary' : 'c_food',
    accountId: S.settings.lastAccount || S.accounts[0]?.id || 'a_card',
    toAccountId: S.accounts[1]?.id || S.accounts[0]?.id || 'a_cash',
    date: todayStr(),
    note: '',
  };

  function catGridHTML(type, selectedId) {
    if (type === 'transfer') return '';
    const list = S.categories.filter(c => c.type === type);
    const sel = list.some(c => c.id === selectedId) ? selectedId : (list[0]?.id || '');
    return list.map(c => `<label class="cat-chip" style="--c:${c.color}">
      <input type="radio" name="categoryId" value="${c.id}" ${c.id === sel ? 'checked' : ''}>
      <span><b>${c.icon}</b>${esc(c.name)}</span>
    </label>`).join('');
  }

  const accOpts = sel => S.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${a.icon} ${esc(a.name)} (${money(balances()[a.id])})</option>`).join('');

  const html = `<form id="txForm" class="form">
    <div class="seg">
      <label><input type="radio" name="type" value="expense" ${t.type === 'expense' ? 'checked' : ''}><span>Расход</span></label>
      <label><input type="radio" name="type" value="income" ${t.type === 'income' ? 'checked' : ''}><span>Доход</span></label>
      <label><input type="radio" name="type" value="transfer" ${t.type === 'transfer' ? 'checked' : ''}><span>Перевод</span></label>
    </div>
    <div>
      <input class="amount-input" name="amount" inputmode="decimal" placeholder="0 (можно 150+80)" value="${t.amount !== '' ? t.amount : ''}" required autocomplete="off">
      <div class="preview" id="txCalcPreview"></div>
    </div>
    <div id="catGridWrap" class="cat-grid">${catGridHTML(t.type, t.categoryId)}</div>
    <div class="grid2">
      <label class="field"><span id="fromAccLbl">${t.type === 'income' ? 'На счёт' : 'Со счёта'}</span>
        <select name="accountId">${accOpts(t.accountId)}</select></label>
      <label class="field ${t.type === 'transfer' ? '' : 'hidden'}" id="toAccField"><span>Куда перевести</span>
        <select name="toAccountId">${accOpts(t.toAccountId)}</select></label>
      <label class="field" id="dateField"><span>Дата</span>
        <input type="date" name="date" value="${t.date}" required></label>
    </div>
    <label class="field"><span>Комментарий (на что именно / мелочь)</span>
      <input name="note" placeholder="Напр.: кофе, хлеб, маршрутка, аптека…" value="${esc(t.note || '')}"></label>
    <div class="sheet-actions">
      ${existing ? `<button type="button" class="btn danger" id="delTxBtn">Удалить</button>` : ''}
      <button type="submit" class="btn primary grow">${existing ? 'Сохранить' : 'Добавить'}</button>
    </div>
  </form>`;

  openSheet(existing ? 'Редактировать операцию' : 'Новая операция', html, sh => {
    const form = $('#txForm', sh);
    const amtInp = form.elements.amount;
    const prev = $('#txCalcPreview', sh);
    if (!existing) setTimeout(() => amtInp.focus(), 180);

    amtInp.oninput = () => {
      const v = amtInp.value.trim();
      if (/[+\-*/]/.test(v)) {
        const res = r2(calc(v));
        prev.textContent = res > 0 ? '= ' + money(res) : '';
      } else prev.textContent = '';
    };

    $$('input[name="type"]', form).forEach(r => r.onchange = () => {
      const tp = form.elements.type.value;
      $('#catGridWrap', sh).innerHTML = catGridHTML(tp, tp === 'income' ? 'c_salary' : 'c_food');
      $('#toAccField', sh).classList.toggle('hidden', tp !== 'transfer');
      $('#fromAccLbl', sh).textContent = tp === 'income' ? 'На счёт' : 'Со счёта';
    });

    if (existing) {
      $('#delTxBtn', sh).onclick = () => {
        if (!confirm('Удалить эту операцию?')) return;
        S.transactions = S.transactions.filter(x => x.id !== existing.id);
        save(); closeSheet(); render(); toast('Операция удалена');
      };
    }

    form.onsubmit = e => {
      e.preventDefault();
      const amount = r2(calc(amtInp.value));
      if (!(amount > 0)) { toast('Введите сумму больше 0'); amtInp.focus(); return; }
      const tp = form.elements.type.value;
      const accountId = form.elements.accountId.value;
      const toAccountId = form.elements.toAccountId.value;
      if (tp === 'transfer' && accountId === toAccountId) {
        toast('Выберите разные счета для перевода'); return;
      }
      const categoryId = tp === 'transfer' ? '' : (form.elements.categoryId?.value || '');
      S.settings.lastAccount = accountId;

      if (existing) {
        Object.assign(existing, {
          type: tp, amount, categoryId, accountId,
          toAccountId: tp === 'transfer' ? toAccountId : '',
          date: form.elements.date.value || todayStr(),
          note: form.elements.note.value.trim(),
        });
      } else {
        S.transactions.push({
          id: uid(),
          type: tp, amount, categoryId, accountId,
          toAccountId: tp === 'transfer' ? toAccountId : '',
          date: form.elements.date.value || todayStr(),
          note: form.elements.note.value.trim(),
          createdAt: Date.now(),
        });
      }
      save(); closeSheet(); render();
      toast(existing ? 'Сохранено' : `${TYPE_N[tp]}: ${money(amount)}`);
    };
  });
}

/* =================== 2. ДОЛГИ И КРЕДИТЫ =================== */
function openDebtSheet(debtId = null) {
  const existing = debtId ? debtById(debtId) : null;
  const paidBefore = existing ? r2(debtPaidPrincipal(existing.id)) : 0;
  const curRem = existing ? debtRemaining(existing) : '';
  const d = existing ? Object.assign({}, existing) : {
    name: '', kind: 'credit', total: '', base: '', rate: '', payment: '', payDay: 15, note: '', closed: false,
  };

  const kindOpts = Object.entries(DEBT_KINDS).map(([k, v]) => `<option value="${k}" ${d.kind === k ? 'selected' : ''}>${v.i} ${v.n}</option>`).join('');

  const html = `<form id="debtForm" class="form">
    <div class="grid2">
      <label class="field"><span>Вид долга / кредита</span><select name="kind">${kindOpts}</select></label>
      <label class="field"><span>Название / кому</span><input name="name" placeholder="Сбер кредит, МФО, Ивану…" value="${esc(d.name)}" required></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Остаток долга СЕЙЧАС</span>
        <input name="remNow" inputmode="decimal" placeholder="Напр. 180000" value="${existing ? curRem : ''}" required>
        <small>Сколько осталось вернуть на сегодня</small></label>
      <label class="field"><span>Изначальная сумма (необяз.)</span>
        <input name="total" inputmode="decimal" placeholder="Для % прогресса" value="${d.total || ''}">
        <small>Сколько брали изначально</small></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Платёж в месяц</span>
        <input name="payment" inputmode="decimal" placeholder="Напр. 12500" value="${d.payment || ''}">
        <small>Оставьте 0, если без графика</small></label>
      <label class="field"><span>Число платежа (1–31)</span>
        <input name="payDay" type="number" min="1" max="31" value="${d.payDay || 15}"></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Ставка % годовых</span>
        <input name="rate" inputmode="decimal" placeholder="0 если без %" value="${d.rate || ''}">
        <small>Для рассрочки и долга другу — 0</small></label>
      <label class="field"><span>Срок в мес. (авторасчёт платежа)</span>
        <input name="calcMonths" type="number" min="1" max="360" placeholder="Напр. 24">
        <small>Подсчитает аннуитетный платёж</small></label>
    </div>
    <div class="preview" id="debtPreview"></div>
    <label class="field"><span>Заметка (договор, условия, телефон)</span>
      <input name="note" placeholder="Любые детали…" value="${esc(d.note || '')}"></label>
    ${existing ? `<label class="check"><input type="checkbox" name="closed" ${d.closed ? 'checked' : ''}><span>Перенести в архив (закрыт)</span></label>` : ''}
    <div class="sheet-actions">
      ${existing ? `<button type="button" class="btn danger" id="delDebtBtn">Удалить</button>` : ''}
      <button type="submit" class="btn primary grow">${existing ? 'Сохранить' : 'Добавить'}</button>
    </div>
  </form>`;

  openSheet(existing ? 'Редактировать долг' : 'Новый долг или кредит', html, sh => {
    const f = $('#debtForm', sh);
    const prev = $('#debtPreview', sh);

    function updatePreview() {
      const rem = calc(f.elements.remNow.value);
      const rate = calc(f.elements.rate.value);
      const m = parseInt(f.elements.calcMonths.value, 10);
      if (rem > 0 && m > 0 && document.activeElement === f.elements.calcMonths) {
        f.elements.payment.value = Math.ceil(annuity(rem, rate, m));
      }
      const pay = calc(f.elements.payment.value);
      if (!(rem > 0) || !(pay > 0)) { prev.innerHTML = ''; return; }
      const p = payoff(rem, rate, pay);
      if (!p) { prev.innerHTML = ''; return; }
      if (p.never) {
        prev.innerHTML = `<span class="neg">⚠️ Ежемесячный процент (${money(rem * rate / 1200)}) больше платежа! Долг никогда не закроется. Увеличьте платёж.</span>`;
      } else {
        const dt = addMonths(new Date(), p.months - 1);
        prev.innerHTML = `📅 Закроется через <b>${p.months} ${plural(p.months, MONTH_FORMS)}</b> (${fmtMonthYear(dt)})${p.interest > 0 ? ` · переплата процентами: <b>${money(p.interest)}</b>` : ' · без переплаты'}`;
      }
    }

    ['remNow', 'rate', 'payment', 'calcMonths'].forEach(k => f.elements[k].addEventListener('input', updatePreview));
    updatePreview();

    if (existing) {
      $('#delDebtBtn', sh).onclick = () => {
        if (!confirm(`Удалить «${existing.name}»? Операции платежей останутся в истории.`)) return;
        S.debts = S.debts.filter(x => x.id !== existing.id);
        save(); closeSheet(); render(); toast('Долг удалён');
      };
    }

    f.onsubmit = e => {
      e.preventDefault();
      const name = f.elements.name.value.trim();
      const remNow = r2(calc(f.elements.remNow.value));
      if (!name) { toast('Укажите название'); return; }
      const base = r2(remNow + paidBefore);
      const total = r2(Math.max(calc(f.elements.total.value) || 0, base));
      const obj = {
        id: existing ? existing.id : uid(),
        name,
        kind: f.elements.kind.value,
        base,
        total,
        rate: r2(calc(f.elements.rate.value)),
        payment: r2(calc(f.elements.payment.value)),
        payDay: clamp(parseInt(f.elements.payDay.value, 10) || 1, 1, 31),
        note: f.elements.note.value.trim(),
        closed: existing ? !!f.elements.closed?.checked : false,
      };
      if (existing) Object.assign(existing, obj);
      else S.debts.push(obj);
      save(); closeSheet(); render(); toast(existing ? 'Изменения сохранены' : 'Долг добавлен');
    };
  });
}

/* ---------- Внесение платежа по долгу / кредиту ---------- */
function openPayDebtSheet(debtId, planDate = null) {
  const d = debtById(debtId);
  if (!d) return;
  const rem = debtRemaining(d);
  const lent = d.kind === 'lent';
  const monthlyInterest = r2(rem * ((+d.rate || 0) / 1200));
  const defaultAmt = +d.payment > 0 ? Math.min(+d.payment, r2(rem + monthlyInterest)) : rem;
  const accOpts = S.accounts.map(a => `<option value="${a.id}" ${a.id === (S.settings.lastAccount || S.accounts[0]?.id) ? 'selected' : ''}>${a.icon} ${esc(a.name)} (${money(balances()[a.id])})</option>`).join('');

  const html = `<form id="payDebtForm" class="form">
    <div class="preview">
      <b>${esc(d.name)}</b> · остаток долга: <b>${money(rem)}</b>
      ${monthlyInterest > 0 ? `<br><span class="muted small">Начисленные проценты за месяц (${d.rate}% годовых): ~${money(monthlyInterest)}</span>` : ''}
    </div>
    <div class="grid2">
      <label class="field"><span>${lent ? 'Сколько вам вернули' : 'Сумма платежа'}</span>
        <input name="amount" inputmode="decimal" value="${defaultAmt || ''}" required></label>
      <label class="field"><span>Из них в счёт основного долга</span>
        <input name="principal" inputmode="decimal" value="${r2(Math.max(0, defaultAmt - monthlyInterest))}" required>
        <small>На сколько уменьшится сам долг</small></label>
    </div>
    <div class="grid2">
      <label class="field"><span>${lent ? 'На счёт' : 'Со счёта'}</span><select name="accountId">${accOpts}</select></label>
      <label class="field"><span>Дата</span><input type="date" name="date" value="${planDate || todayStr()}" required></label>
    </div>
    <label class="field"><span>Комментарий</span><input name="note" placeholder="Ежемесячный платёж / досрочное погашение"></label>
    <div class="sheet-actions"><button type="submit" class="btn primary grow">${lent ? 'Записать возврат' : 'Провести платёж'}</button></div>
  </form>`;

  openSheet(lent ? 'Возврат долга мне' : 'Платёж по долгу / кредиту', html, sh => {
    const f = $('#payDebtForm', sh);
    f.elements.amount.oninput = () => {
      const a = calc(f.elements.amount.value);
      f.elements.principal.value = r2(Math.max(0, a - monthlyInterest));
    };
    f.onsubmit = e => {
      e.preventDefault();
      const amount = r2(calc(f.elements.amount.value));
      const principal = r2(calc(f.elements.principal.value));
      if (!(amount > 0)) { toast('Введите сумму'); return; }
      const dt = f.elements.date.value || todayStr();
      S.transactions.push({
        id: uid(),
        type: lent ? 'income' : 'expense',
        amount,
        principal,
        categoryId: lent ? 'c_debtin' : 'c_debt',
        accountId: f.elements.accountId.value,
        date: dt,
        debtId: d.id,
        plan: 'debt:' + d.id,
        note: f.elements.note.value.trim(),
        createdAt: Date.now(),
      });
      if (debtRemaining(d) <= 0.01) {
        d.closed = true;
        toast('🎉 Поздравляем! Долг полностью закрыт!');
      } else {
        toast('Платёж проведён. Остаток: ' + money(debtRemaining(d)));
      }
      save(); closeSheet(); render();
    };
  });
}

function openDebtHistorySheet(debtId) {
  const d = debtById(debtId);
  if (!d) return;
  const list = S.transactions.filter(t => t.debtId === debtId).sort((a, b) => b.date.localeCompare(a.date));
  const totalPaid = sum(list, 'amount');
  const html = `<div class="preview" style="margin-bottom:10px">Всего платежей: <b>${list.length}</b> на сумму <b>${money(totalPaid)}</b> · Остаток: <b>${money(debtRemaining(d))}</b></div>
    ${list.length ? `<div class="list">${list.map(txRow).join('')}</div>` : emptyBox('📭', 'Платежей по этому долгу ещё не было')}`;
  openSheet('История: ' + d.name, html);
}

/* =================== 3. РЕГУЛЯРНЫЕ ДОХОДЫ И ОБЯЗАТЕЛЬНЫЕ ПЛАТЕЖИ =================== */
function openIncomeSheet(id = null) {
  const existing = id ? S.incomes.find(x => x.id === id) : null;
  const x = existing || { name: '', amount: '', day: 10, accountId: S.accounts[0]?.id || 'a_card', categoryId: 'c_salary', active: true };
  const incCats = S.categories.filter(c => c.type === 'income').map(c => `<option value="${c.id}" ${c.id === x.categoryId ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('');
  const accs = S.accounts.map(a => `<option value="${a.id}" ${a.id === x.accountId ? 'selected' : ''}>${a.icon} ${esc(a.name)}</option>`).join('');

  const html = `<form id="incForm" class="form">

function executePlanItem(key, dateStr) {
  const [kind, id] = key.split(':');
  if (kind === 'debt') { openPayDebtSheet(id, dateStr); return; }
  const item = kind === 'inc' ? S.incomes.find(x => x.id === id) : S.bills.find(x => x.id === id);
  if (!item) return;
  const isInc = kind === 'inc';
  const accs = S.accounts.map(a => `<option value="${a.id}" ${a.id === item.accountId ? 'selected' : ''}>${a.icon} ${esc(a.name)}</option>`).join('');
  const html = `<form id="planExecForm" class="form">
    <div class="preview"><b>${esc(item.name)}</b></div>
    <div class="grid2">
      <label class="field"><span>Фактическая сумма</span><input name="amount" inputmode="decimal" value="${item.amount}" required></label>
      <label class="field"><span>Дата</span><input type="date" name="date" value="${todayStr()}" required></label>
    </div>
    <label class="field"><span>${isInc ? 'На счёт' : 'Со счёта'}</span><select name="accountId">${accs}</select></label>
    <div class="sheet-actions"><button type="submit" class="btn primary grow">${isInc ? 'Зачислить доход' : 'Записать оплату'}</button></div>
  </form>`;

  openSheet(isInc ? 'Получение дохода' : 'Оплата обязательного платежа', html, sh => {
    const f = $('#planExecForm', sh);
    f.onsubmit = e => {
      e.preventDefault();
      const amount = r2(calc(f.elements.amount.value));
      if (!(amount > 0)) return;
      // привязываем к месяцу плановой даты, чтобы отметилось выполненным в текущем месяце
      const txDate = f.elements.date.value || todayStr();
      S.transactions.push({
        id: uid(),
        type: isInc ? 'income' : 'expense',
        amount,
        categoryId: item.categoryId || (isInc ? 'c_salary' : 'c_home'),
        accountId: f.elements.accountId.value,
        date: txDate.slice(0, 7) === dateStr.slice(0, 7) ? txDate : dateStr,
        note: item.name,
        plan: key,
        createdAt: Date.now(),
      });
      save(); closeSheet(); render();
      toast((isInc ? '+' : '−') + money(amount) + ' проведено');
    };
  });
}

      $('#delAccBtn', sh).onclick = () => {

    <div class="sheet-actions"><button type="submit" class="btn primary grow">${isMinus ? 'Снять' : 'Пополнить'}</button></div>

  openSheet(isMinus ? 'Снять с цели' : 'Пополнить цель', html, sh => {
    const f = $('#goalDeltaForm', sh);
    setTimeout(() => f.elements.amt.focus(), 180);

    };
  });

function showLockScreen() {
  if (!S.settings.pin) return;
  const lock = $('#lock');
  let entered = '';
  const draw = () => {
    lock.innerHTML = `<div class="lock-box">
      <div class="lock-logo">🔒</div>
      <h3>Введите PIN-код</h3>
      <div class="dots">${[0, 1, 2, 3].map(i => `<i class="${entered.length > i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="keypad">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button type="button" data-k="${k}">${k}</button>`).join('')}
      </div>
    </div>`;
  };
  draw();
  lock.classList.remove('hidden');
  lock.onclick = e => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    const k = b.dataset.k;
    if (k === '⌫') entered = entered.slice(0, -1);
    else if (entered.length < 4) entered += k;
    draw();
    if (entered.length === 4) {
      if (hashPin(entered) === S.settings.pin) lock.classList.add('hidden');
      else { entered = ''; toast('Неверный PIN'); draw(); }
    }
  };
}

    render();
    window.scrollTo(0, 0);
    return;
  }

  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (actEl.tagName === 'A') e.preventDefault();

  switch (act) {
    case 'back': nav.sub = null; render(); break;
    case 'sub': nav.sub = actEl.dataset.sub; render(); window.scrollTo(0, 0); break;
    case 'goTab': nav.tab = actEl.dataset.tab2; nav.sub = null; render(); window.scrollTo(0, 0); break;
    case 'closeSheet': closeSheet(); break;
    case 'quickAdd': openTxSheet(null, 'expense'); break;
    case 'editTx': openTxSheet(actEl.dataset.id); break;
    case 'transfer': openTxSheet(null, 'transfer'); break;
    case 'dismissStart': S.settings.startDismissed = true; save(); render(); break;
    case 'startStep': {
      const g = actEl.dataset.go;
      if (g === 'plans') { nav.sub = 'plans'; render(); }
      else if (g === 'debts') { nav.tab = 'debts'; nav.sub = null; render(); openDebtSheet(); }
      else if (g === 'quick') openTxSheet(null, 'expense');
      break;
    }
    case 'opsMonth': nav.opsMonth = addMonths(nav.opsMonth, +actEl.dataset.d); render(); break;
    case 'opsType': nav.opsType = actEl.dataset.v; render(); break;
    case 'addDebt': openDebtSheet(null); break;
    case 'editDebt': openDebtSheet(actEl.dataset.id); break;
    case 'payDebt': openPayDebtSheet(actEl.dataset.id); break;
    case 'debtHistory': openDebtHistorySheet(actEl.dataset.id); break;
    case 'toggleClosed': nav.showClosed = !nav.showClosed; render(); break;
    case 'planDo': executePlanItem(actEl.dataset.key, actEl.dataset.date); break;
    case 'editIncome': openIncomeSheet(actEl.dataset.id || null); break;
    case 'editBill': openBillSheet(actEl.dataset.id || null); break;
    case 'editAccount': openAccountSheet(actEl.dataset.id || null); break;
    case 'catTab': nav.catTab = actEl.dataset.v; render(); break;
    case 'editCat': openCatSheet(actEl.dataset.id || null); break;
    case 'editGoal': openGoalSheet(actEl.dataset.id || null); break;
    case 'goalAdd': openGoalDeltaSheet(actEl.dataset.id, !!actEl.dataset.minus); break;
    case 'rp': nav.rp = actEl.dataset.v; render(); break;
    case 'catDrill': openCatDrillSheet(actEl.dataset.id); break;
    case 'exportCSV': {
      const R = reportData();
      saveFile(`finkontrol_ops_${R.from}_${R.to}.csv`, txCSV(R.list), 'text/csv;charset=utf-8');
      break;
    }
    case 'exportCatCSV': {
      const R = reportData();
      const rows = [['Категория', 'Сумма', 'Доля %']];
      R.cats.forEach(x => rows.push([x.c.name, csvNum(x.v), csvNum(x.v / (R.exp || 1) * 100)]));
      saveFile(`finkontrol_categories_${R.from}_${R.to}.csv`, toCSV(rows), 'text/csv;charset=utf-8');
      break;
    }
    case 'exportAll':
      saveFile(`finkontrol_all_${todayStr()}.csv`, txCSV(S.transactions), 'text/csv;charset=utf-8');
      break;
    case 'printReport': printCurrentReport(); break;
    case 'backup': doBackup(); break;
    case 'importData': $('#importFile').click(); break;
    case 'setPin': {
      const p = prompt('Введите 4 цифры для PIN-кода:');
      if (p && /^\d{4}$/.test(p.trim())) {
        S.settings.pin = hashPin(p.trim());
        save(); render(); toast('PIN-код установлен');
      } else if (p !== null) toast('Нужно ровно 4 цифры');
      break;
    }
    case 'removePin':
      S.settings.pin = ''; save(); render(); toast('PIN-код отключён');
      break;
    case 'reset':
      if (confirm('Вы уверены? Все операции, долги и настройки на этом устройстве будут удалены безвозвратно.')) {
        localStorage.removeItem(KEY);
        S = defaultState();
        S.settings.onboarded = true;
        save(); render(); toast('Все данные сброшены');
      }
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'extraInp') {
    nav.extra = Math.max(0, r2(calc(t.value)));
    render();
  } else if (t.dataset.budget) {
    const v = r2(calc(t.value));
    if (v > 0) S.budgets[t.dataset.budget] = v;
    else delete S.budgets[t.dataset.budget];
    save(); render();
  } else if (t.dataset.set) {
    const k = t.dataset.set;
    S.settings[k] = k === 'smallLimit' ? Math.max(0, r2(calc(t.value))) : t.value;
    save(); render();
  } else if (t.dataset.rdate) {
    nav[t.dataset.rdate] = t.value;
    render();
  }
});

$('#importFile').addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.accounts)) {
        throw new Error('Неверный формат файла');
      }
      S = migrate(data);
      S.settings.onboarded = true;
      save(); render();
      toast('Данные успешно восстановлены!');
    } catch (err) {
      alert('Ошибка чтения файла: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// Скрытие стартовой подсказки, если нажали «Скрыть»
const origStartCard = startCard;
window.startCard = function () {
  if (S.settings.startDismissed) return '';
  return origStartCard();
};

/* ---------- Инициализация ---------- */
render();
showLockScreen();
checkOnboarding();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
</body>
</html>
